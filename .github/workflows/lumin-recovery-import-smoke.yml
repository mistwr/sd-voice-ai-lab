name: LUMIN recovery - dependency smoke test
on:
  push:
    branches:
      - recovery/voice-2026-10-19-0900
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install worker requirements
        run: python -m pip install -r worker/requirements.txt
      - name: Import historical worker without starting service
        run: |
          cd worker
          python -c 'import web_agent; print("LUMIN web agent import OK")'
