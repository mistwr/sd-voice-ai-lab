name: Android Gateway

on:
  push:
    branches: ["main", "feature/single-device-sofia-final"]
    paths:
      - "android-gateway/**"
      - ".github/workflows/android-gateway.yml"
  pull_request:
    paths:
      - "android-gateway/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android-gateway
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sd-voice-gateway-debug
          path: android-gateway/app/build/outputs/apk/debug/app-debug.apk
